# Hunter -- value-conservation invariant gate for the v4 hook in this template.
# Fuzzes the hook (deployed at a flag-correct address against a real PoolManager)
# for 6 universal value-conservation properties + an anti-vacuous coverage gate.
# Posts/updates a results comment on each PR. Blocks the PR if an invariant fails
# or if the run was too thin to mean anything (INCONCLUSIVE).
#
# Customizing when you build your own hook:
#   - Update `hook:` below to the path of your hook .sol file.
#   - If your hook is an abstract base, also set `impl: src/<YourImpl>.sol`.
#   - Constructor needs extra args? `ctor-args: 'manager, uint48(10)'` (Solidity expr).
# Docs: https://github.com/Saintk7/hunter-invariants
name: hunter-invariants
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Saintk7/hunter-invariants/actions/v4-invariants@v1
        with:
          hook: src/Counter.sol
